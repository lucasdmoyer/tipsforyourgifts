name: Firebase production release

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Exact approved master commit to release"
        required: true
        type: string

permissions:
  contents: read
  deployments: read
  id-token: write

concurrency:
  group: firebase-production
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      preview_url: ${{ steps.firebase_preview.outputs.preview_url }}
      artifact_name: ${{ steps.release.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - name: Verify owner authority and the exact current master SHA
        id: release
        env:
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          test "$ACTOR" = "$OWNER" || { echo "Only the repository owner may authorize a founder-reviewed production release." >&2; exit 1; }
          git fetch --no-tags origin master
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-parse origin/master)" = "$RELEASE_SHA"
          short_sha="${RELEASE_SHA:0:12}"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "artifact_name=firebase-release-candidate-$short_sha-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - name: Re-run the complete release gates
        run: |
          npm audit --prefix web --omit=dev --audit-level=high
          npm run validate
          npm run build
          npm run smoke
      - id: google_auth
        name: Mint short-lived Google credentials for the exact production workflow
        uses: google-github-actions/auth@v3
        with:
          project_id: tipsforyourgifts
          workload_identity_provider: projects/647657919626/locations/global/workloadIdentityPools/tips-github-production/providers/github-production
          service_account: github-production@tipsforyourgifts.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true
      - name: Deploy the exact release candidate to a temporary Firebase channel
        id: firebase_preview
        env:
          CHANNEL_ID: release-${{ steps.release.outputs.short_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          npx --yes firebase-tools@15.26.0 hosting:channel:deploy "$CHANNEL_ID" \
            --expires 7d \
            --project tipsforyourgifts \
            --non-interactive
          channel_file="$RUNNER_TEMP/firebase-hosting-channels.json"
          npx --yes firebase-tools@15.26.0 hosting:channel:list \
            --site tipsforyourgifts \
            --project tipsforyourgifts \
            --json > "$channel_file"
          preview_url="$(node -e 'const fs = require("node:fs"); const data = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); const suffix = `/channels/${process.env.CHANNEL_ID}`; const channel = data?.result?.channels?.find((entry) => entry.name?.endsWith(suffix)); if (!channel?.url) throw new Error(`Firebase preview URL missing for ${process.env.CHANNEL_ID}`); process.stdout.write(channel.url);' "$channel_file")"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
      - name: Smoke the exact-SHA release candidate
        env:
          PREVIEW_URL: ${{ steps.firebase_preview.outputs.preview_url }}
        run: curl --fail --silent --show-error --location --max-time 30 "$PREVIEW_URL" | grep -F "Good gifts, minus the guesswork."
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release.outputs.artifact_name }}
          path: web/dist
          if-no-files-found: error
          retention-days: 14

  release:
    needs: preview
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ needs.preview.outputs.preview_url }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.preview.outputs.artifact_name }}
          path: web/dist
      - name: Re-prove the approved SHA, downloaded artifact, and reviewed preview
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          PREVIEW_URL: ${{ needs.preview.outputs.preview_url }}
        run: |
          git fetch --no-tags origin master
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-parse origin/master)" = "$RELEASE_SHA"
          npm run smoke
          curl --fail --silent --show-error --location --max-time 30 "$PREVIEW_URL" | grep -F "Good gifts, minus the guesswork."
      - id: google_auth
        name: Mint short-lived Google credentials for the protected live job
        uses: google-github-actions/auth@v3
        with:
          project_id: tipsforyourgifts
          workload_identity_provider: projects/647657919626/locations/global/workloadIdentityPools/tips-github-production/providers/github-production
          service_account: github-production@tipsforyourgifts.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true
      - name: Clone the current live release to a 30-day rollback channel
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          rollback_channel="rollback-${RELEASE_SHA:0:12}-$RUN_ID-$RUN_ATTEMPT"
          npx --yes firebase-tools@15.26.0 hosting:channel:create "$rollback_channel" --expires 30d --site tipsforyourgifts --project tipsforyourgifts --non-interactive
          npx --yes firebase-tools@15.26.0 hosting:clone tipsforyourgifts:live "tipsforyourgifts:$rollback_channel" --project tipsforyourgifts --non-interactive
          npm --prefix web run publication:rollback-record -- --release-sha="$RELEASE_SHA" --target-channel="$rollback_channel" --output=../rollback-target.json
      - uses: actions/upload-artifact@v4
        with:
          name: firebase-rollback-target-${{ github.run_id }}-${{ github.run_attempt }}
          path: rollback-target.json
          if-no-files-found: error
          retention-days: 90
      - name: Deploy the verified exact SHA to Firebase Hosting
        run: npx --yes firebase-tools@15.26.0 deploy --only hosting --project tipsforyourgifts --non-interactive
      - name: Read-only hosted smoke after deployment
        run: curl --fail --silent --show-error --location --max-time 30 https://tipsforyourgifts.web.app | grep -F "Good gifts, minus the guesswork."
      - name: Create the exact-SHA verified publication receipt
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          PREVIEW_URL: ${{ needs.preview.outputs.preview_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: npm --prefix web run publication:receipt -- --release-sha="$RELEASE_SHA" --mode=founder_reviewed --source-workflow=firebase-production --preview-url="$PREVIEW_URL" --rollback-target=../rollback-target.json --manifest=dist/publication-manifest.json --output=../publication-receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: firebase-publication-receipt-${{ inputs.release_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: publication-receipt.json
          if-no-files-found: error
          retention-days: 90
