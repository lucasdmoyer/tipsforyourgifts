name: Verify dedicated AI automation credential

on:
  workflow_dispatch:
    inputs:
      expected_policy_sha256:
        description: "Exact budget-approved AI policy SHA-256 visible in Studio"
        required: true
        type: string
      confirmation:
        description: "Type VERIFY-ai-automation-credential"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ai-automation-credential-verify
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      base_sha: ${{ steps.base.outputs.sha }}
      policy_sha256: ${{ steps.policy.outputs.sha256 }}
    steps:
      - name: Require repository-owner decision
        env:
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          CONFIRMATION: ${{ inputs.confirmation }}
          REF: ${{ github.ref }}
        run: |
          test "$ACTOR" = "$OWNER" || { echo "Only the repository owner may verify the AI automation credential." >&2; exit 1; }
          test "$CONFIRMATION" = "VERIFY-ai-automation-credential" || { echo "Action-time confirmation does not match AI credential verification." >&2; exit 1; }
          test "$REF" = "refs/heads/master" || { echo "Credential verification must be dispatched from master." >&2; exit 1; }
      - uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false
      - name: Bind verification to the exact trusted base
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: "24.14.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Prove the budget gate before any secret is exposed
        id: policy
        env:
          EXPECTED_POLICY_SHA256: ${{ inputs.expected_policy_sha256 }}
        run: |
          npm ci --prefix web
          npm run validate
          actual_sha256="$(shasum -a 256 web/config/ai-automation-policy.json | cut -d ' ' -f 1)"
          test "$actual_sha256" = "$EXPECTED_POLICY_SHA256" || { echo "AI automation policy changed after founder review." >&2; exit 1; }
          test "$(node -p "JSON.parse(require('fs').readFileSync('web/config/ai-automation-policy.json','utf8')).status")" = "budget_approved_awaiting_credential" || { echo "Policy is not awaiting credential verification." >&2; exit 1; }
          echo "sha256=$actual_sha256" >> "$GITHUB_OUTPUT"

  verify:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ai-automation-credential
    permissions: {}
    outputs:
      receipt_name: ${{ steps.receipt.outputs.name }}
    steps:
      - name: Authenticate the dedicated credential without running repository code
        id: authenticate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPENAI_API_KEY" || { echo "Repository secret OPENAI_API_KEY is missing." >&2; exit 1; }
          http_status="$(
            printf 'header = "Authorization: Bearer %s"\n' "$OPENAI_API_KEY" |
              curl --config - --silent --show-error --output /dev/null --write-out '%{http_code}' --connect-timeout 10 --max-time 30 https://api.openai.com/v1/models
          )"
          test "$http_status" = "200" || { echo "Credential verification returned HTTP $http_status; no response body was retained." >&2; exit 1; }
          echo "http_status=$http_status" >> "$GITHUB_OUTPUT"
      - name: Create the credential-free verification receipt
        id: receipt
        env:
          HTTP_STATUS: ${{ steps.authenticate.outputs.http_status }}
          BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
          POLICY_SHA256: ${{ needs.prepare.outputs.policy_sha256 }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          REF: ${{ github.ref }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          verified_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          jq -n \
            --arg verifiedAt "$verified_at" \
            --arg repository "$REPOSITORY" \
            --arg actor "$ACTOR" \
            --arg ref "$REF" \
            --arg baseSha "$BASE_SHA" \
            --arg basePolicySha256 "$POLICY_SHA256" \
            --arg workflowRunId "$RUN_ID" \
            --arg workflowRunUrl "$SERVER_URL/$REPOSITORY/actions/runs/$RUN_ID" \
            --argjson workflowRunAttempt "$RUN_ATTEMPT" \
            --argjson httpStatus "$HTTP_STATUS" \
            '{schemaVersion:"1.0.0",secretName:"OPENAI_API_KEY",method:"openai_models_endpoint",endpoint:"https://api.openai.com/v1/models",outcome:"authenticated",httpStatus:$httpStatus,verifiedAt:$verifiedAt,repository:$repository,actor:$actor,ref:$ref,baseSha:$baseSha,basePolicySha256:$basePolicySha256,workflowRunId:$workflowRunId,workflowRunAttempt:$workflowRunAttempt,workflowRunUrl:$workflowRunUrl,secretValueStored:false,responseBodyStored:false,modelCalled:false,policyActivated:false}' > credential-verification.json
          echo "name=ai-credential-verification-$RUN_ID-$RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.receipt.outputs.name }}
          path: credential-verification.json
          if-no-files-found: error
          retention-days: 30

  open_pull_request:
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24.14.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.verify.outputs.receipt_name }}
      - name: Record and re-prove the credential-free receipt
        env:
          EXPECTED_POLICY_SHA256: ${{ needs.prepare.outputs.policy_sha256 }}
          CONFIRMATION: ${{ inputs.confirmation }}
          FOUNDER_LOGIN: ${{ github.actor }}
          BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          npm ci --prefix web
          GITHUB_SHA="$BASE_SHA" npm --prefix web run ai:credential:record -- --receipt=credential-verification.json --expected-policy-sha256="$EXPECTED_POLICY_SHA256" --confirmation="$CONFIRMATION" --founder-login="$FOUNDER_LOGIN"
          rm credential-verification.json
          npm --prefix web run generate
          while IFS= read -r changed_path; do
            case "$changed_path" in
              web/config/ai-automation-policy.json|web/config/ai-credential-verification.json|web/src/data/operations.json|web/src/app/generated/content.generated.ts|web/src/app/generated/studio.generated.ts|web/public/sitemap.xml) ;;
              *) echo "AI credential verification changed forbidden path: $changed_path" >&2; exit 1 ;;
            esac
          done < <(git diff --name-only HEAD)
          npm run validate
          npm run build
          npm run smoke
          git diff --check
      - name: Commit the founder-review proposal
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="codex/verify-ai-credential-$RUN_ID-$RUN_ATTEMPT"
          git switch -c "$branch"
          git add web/config/ai-automation-policy.json web/config/ai-credential-verification.json web/src/data/operations.json web/src/app/generated/content.generated.ts web/src/app/generated/studio.generated.ts web/public/sitemap.xml
          git commit -m "Record AI automation credential verification"
          git push origin "$branch"
      - name: Open the credential-verification pull request
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          branch="codex/verify-ai-credential-$RUN_ID-$RUN_ATTEMPT"
          gh pr create --base master --head "$branch" --title "Record AI automation credential verification" --body "The protected verifier authenticated the dedicated repository secret against OpenAI's documented models endpoint, discarded the response body, and created a credential-free receipt bound to the exact budget-approved policy and master SHA. The secret was available only to the isolated verifier step, which checked out and ran no repository code. This proposal stores no secret, calls no model, does not activate the policy, cannot merge itself, and cannot deploy or publish. Explicit policy activation remains a separate protected founder decision."
