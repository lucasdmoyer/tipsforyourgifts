name: Publish one approved Pinterest Pin

on:
  workflow_dispatch:
    inputs:
      post_id:
        description: "Exact approved Pinterest post ID"
        required: true
        type: string
      expected_head_sha:
        description: "Exact master commit SHA reviewed at action time"
        required: true
        type: string
      expected_approval_sha256:
        description: "SHA-256 of the exact content approval JSON"
        required: true
        type: string
      expected_media_record_sha256:
        description: "SHA-256 of the exact approved media JSON"
        required: true
        type: string
      confirmation:
        description: "Type PUBLISH- followed by the exact post ID"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: social-pinterest-publish-${{ inputs.post_id }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: social-production
    steps:
      - name: Require repository-owner action-time decision
        env:
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          POST_ID: ${{ inputs.post_id }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$ACTOR" = "$OWNER" || { echo "Only the repository owner may publish externally." >&2; exit 1; }
          [[ "$POST_ID" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]] || { echo "Invalid post ID." >&2; exit 1; }
          [[ "$EXPECTED_HEAD_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "Invalid exact head SHA." >&2; exit 1; }
          test "$CONFIRMATION" = "PUBLISH-$POST_ID" || { echo "Action-time confirmation does not match the exact post." >&2; exit 1; }
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.expected_head_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Prove exact master SHA and publication plan
        env:
          POST_ID: ${{ inputs.post_id }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          EXPECTED_APPROVAL_SHA256: ${{ inputs.expected_approval_sha256 }}
          EXPECTED_MEDIA_RECORD_SHA256: ${{ inputs.expected_media_record_sha256 }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA" || { echo "Checkout does not match the reviewed SHA." >&2; exit 1; }
          test "$(git rev-parse origin/master)" = "$EXPECTED_HEAD_SHA" || { echo "Reviewed SHA is no longer master." >&2; exit 1; }
          [[ "$EXPECTED_APPROVAL_SHA256" =~ ^[a-f0-9]{64}$ ]] || { echo "Invalid approval SHA-256." >&2; exit 1; }
          [[ "$EXPECTED_MEDIA_RECORD_SHA256" =~ ^[a-f0-9]{64}$ ]] || { echo "Invalid media record SHA-256." >&2; exit 1; }
          npm ci --prefix web
          npm run validate
          npm --prefix web run social:pinterest:plan -- --post-id="$POST_ID" --expected-approval-sha256="$EXPECTED_APPROVAL_SHA256" --expected-media-record-sha256="$EXPECTED_MEDIA_RECORD_SHA256"
      - name: Create durable no-duplicate publication lock
        env:
          POST_ID: ${{ inputs.post_id }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/social-publish-lock/$POST_ID" >/dev/null 2>&1; then
            echo "A durable publication lock already exists. Recover its receipt; do not retry blindly." >&2
            exit 1
          fi
          git tag "social-publish-lock/$POST_ID" "$EXPECTED_HEAD_SHA"
          git push origin "refs/tags/social-publish-lock/$POST_ID"
      - name: Publish through the official Pinterest API
        id: publish
        env:
          POST_ID: ${{ inputs.post_id }}
          EXPECTED_APPROVAL_SHA256: ${{ inputs.expected_approval_sha256 }}
          EXPECTED_MEDIA_RECORD_SHA256: ${{ inputs.expected_media_record_sha256 }}
          CONFIRM_EXTERNAL_SOCIAL_PUBLISH: ${{ inputs.confirmation }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
        run: npm --prefix web run social:pinterest:plan -- --post-id="$POST_ID" --expected-approval-sha256="$EXPECTED_APPROVAL_SHA256" --expected-media-record-sha256="$EXPECTED_MEDIA_RECORD_SHA256" --execute
      - name: Preserve the external publication receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: social-publication-receipt-${{ inputs.post_id }}-${{ github.run_id }}
          path: web/social/publications/${{ inputs.post_id }}.json
          if-no-files-found: warn
          retention-days: 90
      - name: Validate and generate the receipt patch
        run: |
          npm --prefix web run generate
          npm run validate
          npm run build
          npm run smoke
          git diff --check
      - name: Commit the verifiable publication receipt
        env:
          RUN_ID: ${{ github.run_id }}
          POST_ID: ${{ inputs.post_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "codex/record-social-publish-$RUN_ID"
          git add "web/social/publications/$POST_ID.json" web/src/data/operations.json web/src/app/generated/content.generated.ts web/public/sitemap.xml
          git commit -m "Record Pinterest publication $POST_ID"
          git push origin "codex/record-social-publish-$RUN_ID"
      - name: Open the publication receipt pull request
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          POST_ID: ${{ inputs.post_id }}
        run: |
          gh pr create --base master --head "codex/record-social-publish-$RUN_ID" --title "Record Pinterest publication $POST_ID" --body "The protected official-API job returned an external Pin ID. This PR records the immutable receipt and updates the executive queue. The durable tag prevents blind retries; any deletion or rollback is a separate founder-approved external action."
