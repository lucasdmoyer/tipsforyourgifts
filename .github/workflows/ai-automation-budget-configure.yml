name: Record founder-approved AI automation budget

on:
  workflow_dispatch:
    inputs:
      expected_policy_sha256:
        description: "Exact AI automation policy SHA-256 visible in Studio"
        required: true
        type: string
      monthly_budget_usd:
        description: "Founder-approved OpenAI project monthly hard spend limit in USD"
        required: true
        type: string
      hard_limit_enabled:
        description: "Confirm OpenAI project hard-limit enforcement is enabled (must be true)"
        required: true
        type: boolean
      alert_threshold_usd:
        description: "Earlier monthly spend alert in USD; must be below the hard limit"
        required: true
        type: string
      platform_evidence_url:
        description: "Credential-free platform.openai.com settings URL showing the external budget"
        required: true
        type: string
      confirmation:
        description: "Type CONFIGURE-ai-automation-budget"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ai-automation-budget-configure
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      base_sha: ${{ steps.base.outputs.sha }}
    steps:
      - name: Require repository-owner decision
        env:
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$ACTOR" = "$OWNER" || { echo "Only the repository owner may record the AI automation budget." >&2; exit 1; }
          test "$CONFIRMATION" = "CONFIGURE-ai-automation-budget" || { echo "Action-time confirmation does not match the AI automation budget." >&2; exit 1; }
      - uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false
      - name: Bind the proposal to the exact master commit
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: "24.14.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Record the credential-free budget attestation
        env:
          EXPECTED_POLICY_SHA256: ${{ inputs.expected_policy_sha256 }}
          MONTHLY_BUDGET_USD: ${{ inputs.monthly_budget_usd }}
          HARD_LIMIT_ENABLED: ${{ inputs.hard_limit_enabled }}
          ALERT_THRESHOLD_USD: ${{ inputs.alert_threshold_usd }}
          PLATFORM_EVIDENCE_URL: ${{ inputs.platform_evidence_url }}
          CONFIRMATION: ${{ inputs.confirmation }}
          FOUNDER_LOGIN: ${{ github.actor }}
        run: |
          npm ci --prefix web
          npm run validate
          npm --prefix web run ai:budget:configure -- --expected-policy-sha256="$EXPECTED_POLICY_SHA256" --monthly-budget-usd="$MONTHLY_BUDGET_USD" --hard-limit-enabled="$HARD_LIMIT_ENABLED" --alert-threshold-usd="$ALERT_THRESHOLD_USD" --platform-evidence-url="$PLATFORM_EVIDENCE_URL" --confirmation="$CONFIRMATION" --founder-login="$FOUNDER_LOGIN"
          npm --prefix web run generate
      - name: Prove the proposal has no model, credential, or production authority
        run: |
          while IFS= read -r changed_path; do
            case "$changed_path" in
              web/config/ai-automation-policy.json|web/src/data/operations.json|web/src/app/generated/content.generated.ts|web/src/app/generated/studio.generated.ts|web/public/sitemap.xml) ;;
              *) echo "AI budget configuration changed forbidden path: $changed_path" >&2; exit 1 ;;
            esac
          done < <(git diff --name-only HEAD)
          npm run validate
          npm run build
          npm run smoke
          git diff --check
          git diff --binary HEAD > ai-budget.patch
          test -s ai-budget.patch
      - uses: actions/upload-artifact@v7
        with:
          name: ai-budget-proposal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ai-budget.patch
          if-no-files-found: error
          retention-days: 7

  open_pull_request:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24.14.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/download-artifact@v8
        with:
          name: ai-budget-proposal-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Re-prove and commit the exact credential-free patch
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          git apply --index ai-budget.patch
          rm ai-budget.patch
          while IFS= read -r changed_path; do
            case "$changed_path" in
              web/config/ai-automation-policy.json|web/src/data/operations.json|web/src/app/generated/content.generated.ts|web/src/app/generated/studio.generated.ts|web/public/sitemap.xml) ;;
              *) echo "AI budget writer received forbidden path: $changed_path" >&2; exit 1 ;;
            esac
          done < <(git diff --cached --name-only)
          npm ci --prefix web
          npm run validate
          npm run build
          npm run smoke
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="codex/configure-ai-budget-$RUN_ID-$RUN_ATTEMPT"
          git switch -c "$branch"
          git commit -m "Record founder-approved AI automation budget"
          git push origin "$branch"
      - name: Open the founder-review pull request
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          branch="codex/configure-ai-budget-$RUN_ID-$RUN_ATTEMPT"
          gh pr create --base master --head "$branch" --title "Record founder-approved AI automation budget" --body "This owner-dispatched, exact-hash proposal records a founder-attested OpenAI project monthly hard spend limit, confirms hard-limit enforcement, records an earlier spend alert, and stores a credential-free platform settings URL. OpenAI documents that hard-limit enforcement is not instantaneous, so small overage remains possible. This workflow does not create or modify the external controls, add an API key, call a model, activate the policy, merge, deploy Firebase, publish content, activate affiliate links, post to social media, or send email. Credential verification and explicit policy activation remain separate reviewed gates."
