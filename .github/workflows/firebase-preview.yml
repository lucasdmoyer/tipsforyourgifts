name: Firebase preview

on:
  pull_request:

concurrency:
  group: firebase-preview-pr-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  classify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      hosting_changed: ${{ steps.scope.outputs.hosting_changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect a credential-free workflow-only review
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          hosting_changed=false
          while IFS= read -r changed_path; do
            case "$changed_path" in
              .github/workflows/firebase-preview.yml|.github/workflows/firebase-preview-deploy.yml|docs/PUBLICATION_AUTOMATION.md|web/scripts/test-publication-policy-gate.mjs|web/config/live-publication.json|web/releases/receipts/*.json|web/src/data/operations.json|web/src/app/generated/content.generated.ts) ;;
              *) hosting_changed=true ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")
          echo "hosting_changed=$hosting_changed" >> "$GITHUB_OUTPUT"

  deploy_preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    needs: classify
    permissions:
      contents: read
      id-token: write
    uses: lucasdmoyer/tipsforyourgifts/.github/workflows/firebase-preview-deploy.yml@master
    with:
      hosting_changed: ${{ needs.classify.outputs.hosting_changed == 'true' }}
      pr_number: ${{ github.event.number }}

  preview:
    name: preview
    if: always()
    needs:
      - classify
      - deploy_preview
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Preserve the required preview check while delegating execution
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          DEPLOY_PREVIEW_RESULT: ${{ needs.deploy_preview.result }}
        run: |
          test "$CLASSIFY_RESULT" = "success"
          test "$DEPLOY_PREVIEW_RESULT" = "success"
